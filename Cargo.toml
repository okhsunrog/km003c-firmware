[workspace]
resolver = "3"
members = ["crates/km003c-interface", "crates/km003c-drivers", "crates/km003c-host-lib", "crates/km003c-host-cli"]
exclude = ["firmware"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.dependencies]
km003c-interface = { path = "crates/km003c-interface" }
km003c-host-lib = { path = "crates/km003c-host-lib" }
postcard-rpc = { git = "https://github.com/jamesmunns/postcard-rpc", rev = "2469ebc6", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
tokio = "1.54.1"
anyhow = "1.0.104"
