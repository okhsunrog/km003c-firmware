[package]
name = "km003c-rust-smoke"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Hardware candidates are opt-in until separately accepted on this board.
measurement = []
measurement-reset-test = ["measurement"]
pd-capture = []
# Manual visual checks need time for the operator to receive the prompt.
# Exit/panic still request DFU immediately; this only extends the fallback.
manual-ui-test = []

[dependencies]
cortex-m = "0.7.10"
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-hc32 = { git = "https://github.com/okhsunrog/hc32f460-embassy-rs", rev = "08a2603185d5acd05fda156e9cef468d47526be1", version = "0.1.0", default-features = false, features = ["rt", "critical-section-single-core", "time-driver"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "c2413d5994bbd8b7e6d5975fd49e6427cb903a02", version = "0.8.0" }
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", features = ["log"] }
embassy-usb-synopsys-otg = { version = "0.4.0", features = ["log"], git = "https://github.com/embassy-rs/embassy.git", rev = "c2413d5994bbd8b7e6d5975fd49e6427cb903a02" }
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
heapless = "0.9.3"
km003c-drivers = { version = "0.1.0", path = "crates/km003c-drivers" }
log = { version = "0.4.34", default-features = false }
static_cell = "2.1.1"

[patch.crates-io]
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "c2413d5994bbd8b7e6d5975fd49e6427cb903a02" }
