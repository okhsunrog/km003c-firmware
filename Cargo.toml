[package]
name = "km003c-rust-smoke"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.10"
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-hc32 = { git = "https://github.com/okhsunrog/hc32f460-embassy-rs", rev = "08a2603185d5acd05fda156e9cef468d47526be1", version = "0.1.0", default-features = false, features = ["rt", "critical-section-single-core"] }
embassy-usb = "0.6.0"
embassy-usb-synopsys-otg = "0.4.0"
static_cell = "2.1.1"
