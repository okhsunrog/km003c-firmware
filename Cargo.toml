[package]
name = "km003c-rust-smoke"
version = "0.1.0"
edition = "2024"

# PD's software GoodCRC needs cross-crate optimization of the per-edge decoder.
[profile.release]
lto = "thin"
codegen-units = 1

[features]
default = []
# Hardware candidates are opt-in until separately accepted on this board.
measurement = []
measurement-reset-test = ["measurement"]
pd-capture = []
# Deliberate, leased CC1/CC2 attach / fixed Get_Source_Capabilities bench probe.
pd-tx-test = ["pd-capture", "cdc-telemetry"]
pd-sink = ["pd-tx-test", "dep:usbpd", "dep:usbpd-traits", "dep:uom"]
pd-bench = ["pd-sink"]
orientation = []
# NDJSON measurement/PD diagnostics instead of the byte echo protocol.
cdc-telemetry = ["measurement"]
# Compatibility with earlier bring-up scripts; automatic DFU reset is removed.
manual-ui-test = []

[dependencies]
cortex-m = "0.7.10"
cortex-m-rt = "0.7.7"
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git", rev = "c2413d5994bbd8b7e6d5975fd49e6427cb903a02", version = "0.6.0" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-futures = "0.1.2"
embassy-hc32 = { git = "https://github.com/okhsunrog/hc32f460-embassy-rs", rev = "23e09a053ddf5284d28c06407b9172adf9c48a34", version = "0.1.0", default-features = false, features = ["rt", "critical-section-single-core", "time-driver-tmra"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "c2413d5994bbd8b7e6d5975fd49e6427cb903a02", version = "0.8.0" }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
embassy-usb = { version = "0.6.0", features = ["log"] }
embassy-usb-synopsys-otg = { version = "0.4.0", features = ["log"], git = "https://github.com/embassy-rs/embassy.git", rev = "c2413d5994bbd8b7e6d5975fd49e6427cb903a02" }
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
heapless = "0.9.3"
km003c-drivers = { version = "0.1.0", path = "crates/km003c-drivers" }
log = { version = "0.4.34", default-features = false }
static_cell = "2.1.1"
uom = { version = "0.36.0", default-features = false, features = ["si", "u32"], optional = true }
usbpd = { version = "2.0.0", features = ["log"], optional = true }
usbpd-traits = { version = "2.0.0", optional = true }

[patch.crates-io]
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "c2413d5994bbd8b7e6d5975fd49e6427cb903a02" }
